<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Petrol Exp</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Petrol Exp">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  html,body{margin:0;height:100%;background:#0f172a;color:#e2e8f0;font:15px system-ui,-apple-system,Roboto,sans-serif;overflow:hidden}
  #app{position:fixed;inset:0;width:100%;height:100%;border:0;padding-top:env(safe-area-inset-top);box-sizing:border-box;background:#0f172a}
  .full{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;background:#0f172a;z-index:5}
  .full img{width:96px;height:96px;border-radius:22px}
  .spin{width:38px;height:38px;border:4px solid #334155;border-top-color:#f97316;border-radius:50%;animation:s 1s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  button{font:inherit;border:0;border-radius:10px;background:#f97316;color:#fff;padding:12px 20px;font-weight:600;cursor:pointer}
  #install{position:fixed;right:14px;bottom:84px;z-index:6;box-shadow:0 6px 20px rgba(0,0,0,.4)}
  [hidden]{display:none!important}
</style>
</head>
<body>

<!-- Splash -->
<div class="full" id="splash"><img src="icon-192.png" alt=""><b style="font-size:20px">Petrol Exp</b><div class="spin"></div></div>

<!-- Offline -->
<div class="full" id="offline" hidden>
  <img src="icon-192.png" alt="">
  <b style="font-size:20px">Internet nahi hai</b>
  <div style="color:#94a3b8">Net on karke dobara try karein</div>
  <button onclick="location.reload()">🔄 Retry</button>
</div>

<iframe id="app" title="Petrol Exp" allow="camera; clipboard-write"></iframe>
<button id="install" hidden>📲 App Install karein</button>

<script>
/* ============================================================
   👇 Yahan apna Apps Script Web App URL daalein (…/exec wala)
   ============================================================ */
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwMfJrSbBdiMJeuu48uc60rvP0He4htreaZRXfhdcYXje7SPOfe_wexm5eWAOFO_Ro/exec
';

const frame = document.getElementById('app');
function start() {
  if (!navigator.onLine) { document.getElementById('offline').hidden = false; return; }
  document.getElementById('offline').hidden = true;
  frame.onload = () => setTimeout(() => document.getElementById('splash').hidden = true, 300);
  frame.src = SCRIPT_URL;
}
window.addEventListener('online', () => { if (!frame.src) start(); });
window.addEventListener('offline', () => { if (!frame.src) document.getElementById('offline').hidden = false; });
start();

/* Service worker (install ke liye zaroori) */
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');

/* Android: Install button */
let deferred;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); deferred = e;
  document.getElementById('install').hidden = false;
});
document.getElementById('install').onclick = async () => {
  if (!deferred) return;
  deferred.prompt(); await deferred.userChoice; deferred = null;
  document.getElementById('install').hidden = true;
};
window.addEventListener('appinstalled', () => document.getElementById('install').hidden = true);
</script>
</body>
</html>
