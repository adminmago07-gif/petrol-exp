<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff5e3a">
<title>Petrol Exp</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Petrol Exp">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  html,body{margin:0;height:100%;background:#f3f6fc;color:#0f172a;font:15px system-ui,-apple-system,Roboto,sans-serif;overflow:hidden}
  #app{position:fixed;inset:0;width:100%;height:100%;border:0;padding-top:env(safe-area-inset-top);box-sizing:border-box;background:#f3f6fc}
  .full{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;background:linear-gradient(180deg,#fff3e8,#f3f6fc);z-index:5}
  .full img{width:96px;height:96px;border-radius:22px}
  .spin{width:38px;height:38px;border:4px solid #fed7aa;border-top-color:#f97316;border-radius:50%;animation:s 1s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  button{font:inherit;border:0;border-radius:10px;background:#f97316;color:#fff;padding:12px 20px;font-weight:600;cursor:pointer}
  #install{position:fixed;right:14px;bottom:84px;z-index:6;box-shadow:0 6px 20px rgba(0,0,0,.4)}
  [hidden]{display:none!important}
</style>
</head>
<body>

<!-- Splash -->
<div class="full" id="splash"><img src="icon-192.png" alt=""><b style="font-size:22px;color:#ff5e3a">Petrol Exp</b><div class="spin"></div></div>

<!-- Offline -->
<div class="full" id="offline" hidden>
  <img src="icon-192.png" alt="">
  <b style="font-size:20px">Internet nahi hai</b>
  <div style="color:#64748b">Net on karke dobara try karein</div>
  <button onclick="location.reload()">🔄 Retry</button>
</div>

<iframe id="app" title="Petrol Exp" allow="camera; geolocation; clipboard-write"></iframe>
<button id="install" hidden>📲 App Install karein</button>

<script>
/* ============================================================
   👇 Yahan apna Apps Script Web App URL daalein (…/exec wala)
   ============================================================ */
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbye6LydqKGoHy76lIxmS0NRnKhbrl2D4JfGcW1VQGpQG2xFagDZV5c0sQEUJDCa0Qc/exec';

const frame = document.getElementById('app');
function start() {
  if (!navigator.onLine) { document.getElementById('offline').hidden = false; return; }
  document.getElementById('offline').hidden = true;
  frame.onload = () => setTimeout(() => document.getElementById('splash').hidden = true, 300);
  frame.src = SCRIPT_URL;
}
window.addEventListener('online', () => { if (!frame.src) start(); });
window.addEventListener('offline', () => { if (!frame.src) document.getElementById('offline').hidden = false; });
start();

/* Service worker (install ke liye zaroori) */
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');

/* ===== Location: yahi page location leta hai aur andar wali app ko bhejta hai ===== */
const WRAP_V = 4;
let lastLoc = null, lastErr = null;
function bcast(msg, w, depth) {
  w = w || frame.contentWindow; depth = depth || 0;
  if (!w || depth > 6) return;
  try { w.postMessage(msg, '*'); } catch (e) {}
  let n = 0; try { n = w.frames.length; } catch (e) {}
  for (let i = 0; i < n; i++) { try { bcast(msg, w.frames[i], depth + 1); } catch (e) {} }
}
function sendLoc() {
  if (lastLoc) bcast(Object.assign({ pe: 'loc', ok: true, v: WRAP_V }, lastLoc));
  else if (lastErr != null) bcast({ pe: 'loc', ok: false, code: lastErr, v: WRAP_V });
}
const gotPos = p => { lastLoc = { lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy, t: Date.now() }; lastErr = null; sendLoc(); };
let watchId = null;
function startWatch() {
  if (!navigator.geolocation) { lastErr = 2; return; }
  if (watchId != null) navigator.geolocation.clearWatch(watchId);
  // Jaldi wali (network) location
  navigator.geolocation.getCurrentPosition(p => { if (!lastLoc) gotPos(p); }, () => {},
    { enableHighAccuracy: false, timeout: 15000, maximumAge: 300000 });
  // GPS wali sahi location, lagataar update
  watchId = navigator.geolocation.watchPosition(gotPos,
    err => { if (!lastLoc) { lastErr = err.code; sendLoc(); } },
    { enableHighAccuracy: true, timeout: 30000, maximumAge: 30000 });
}
function oneShot(fresh) {
  if (!navigator.geolocation) { lastErr = 2; return sendLoc(); }
  if (lastLoc && Date.now() - lastLoc.t < 60000) return sendLoc();
  navigator.geolocation.getCurrentPosition(gotPos, err => {
    if (err.code === 1) { lastErr = 1; lastLoc = null; return sendLoc(); }
    navigator.geolocation.getCurrentPosition(gotPos, err2 => { if (!lastLoc) { lastErr = err2.code; sendLoc(); } else sendLoc(); },
      { enableHighAccuracy: false, timeout: 15000, maximumAge: 300000 });
  }, { enableHighAccuracy: true, timeout: 10000, maximumAge: fresh ? 0 : 60000 });
}
startWatch();
frame.addEventListener('load', () => {
  bcast({ pe: 'hello', v: WRAP_V });
  setTimeout(() => { bcast({ pe: 'hello', v: WRAP_V }); sendLoc(); }, 1500);
  setTimeout(sendLoc, 5000);
});
window.addEventListener('message', e => {
  const d = e.data;
  if (!d || typeof d !== 'object') return;
  if (d.pe === 'ping') { bcast({ pe: 'hello', v: WRAP_V }); sendLoc(); }
  if (d.pe === 'getLoc') { if (lastErr === 1) startWatch(); oneShot(d.fresh); }
});
// App wapas khulne par location taaza karo
document.addEventListener('visibilitychange', () => { if (!document.hidden) oneShot(false); });

let deferred;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); deferred = e;
  document.getElementById('install').hidden = false;
});
document.getElementById('install').onclick = async () => {
  if (!deferred) return;
  deferred.prompt(); await deferred.userChoice; deferred = null;
  document.getElementById('install').hidden = true;
};
window.addEventListener('appinstalled', () => document.getElementById('install').hidden = true);
</script>
</body>
</html>
